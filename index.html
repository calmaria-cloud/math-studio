<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="「数形」高中数学作图器：只保留高中用得上的函数作图与立体几何功能，单文件、离线可用。">
<title>数形 · 高中数学作图器 | 函数与立体几何</title>
<style>:root {
  --mv-bg: #f3f5f9;
  --mv-panel: #ffffff;
  --mv-panel-2: #f8fafc;
  --mv-ink: #1b2333;
  --mv-muted: #687186;
  --mv-line: #e3e8f0;
  --mv-line-strong: #cfd6e4;
  --mv-accent: #2563eb;
  --mv-accent-soft: #e9efff;
  --mv-teal: #0d9488;
  --mv-warn: #d97706;
  --mv-danger: #dc2626;
  --mv-radius: 12px;
  --mv-shadow: 0 1px 2px rgba(20, 32, 60, .05), 0 8px 24px rgba(20, 32, 60, .06);
  --mv-font: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --mv-font-math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
  --mv-topbar-h: 58px;
  --mv-status-h: 30px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: var(--mv-bg);
  color: var(--mv-ink);
  font-family: var(--mv-font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button {
  font-family: inherit;
  color: inherit;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

/* ---------- 顶栏 ---------- */
.topbar {
  flex: 0 0 var(--mv-topbar-h);
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 18px;
  background: var(--mv-panel);
  border-bottom: 1px solid var(--mv-line);
  position: relative;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 238px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(145deg, #2563eb, #4f46e5);
  display: grid;
  place-items: center;
  color: #fff;
  box-shadow: 0 4px 10px rgba(37, 99, 235, .25);
  flex: 0 0 auto;
}

.brand-mark svg { width: 22px; height: 22px; display: block; }

.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 15px; letter-spacing: .2px; font-weight: 650; }
.brand-text small { color: var(--mv-muted); font-size: 11.5px; margin-top: 2px; letter-spacing: .2px; }

.tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--mv-panel-2);
  border: 1px solid var(--mv-line);
  border-radius: 12px;
  padding: 4px;
}

.tab {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--mv-muted);
  font-size: 13.5px;
  font-weight: 550;
  padding: 7px 18px;
  border-radius: 9px;
  cursor: pointer;
  transition: background .16s ease, color .16s ease, box-shadow .16s ease;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}

.tab svg { width: 15px; height: 15px; opacity: .85; }

.tab:hover { color: var(--mv-ink); background: #fff; }

.tab.is-active {
  background: var(--mv-panel);
  color: var(--mv-accent);
  box-shadow: 0 1px 3px rgba(20, 32, 60, .1);
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tb-btn {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--mv-muted);
  font-size: 12.5px;
  padding: 7px 10px;
  border-radius: 9px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background .15s, color .15s, border-color .15s;
}

.tb-btn svg { width: 15px; height: 15px; }
.tb-btn:hover { background: var(--mv-panel-2); color: var(--mv-ink); border-color: var(--mv-line); }
.tb-btn.is-on { color: var(--mv-accent); background: var(--mv-accent-soft); border-color: #c9d9ff; }

/* ---------- 主舞台 ---------- */
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
}

.panel {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  display: none;
  overflow: hidden;
}

.panel.is-active { display: flex; }

.panel > .mv-module-fallback {
  margin: auto;
  color: var(--mv-muted);
  font-size: 13px;
  text-align: center;
  line-height: 1.8;
}

/* ---------- 状态栏 ---------- */
.statusbar {
  flex: 0 0 var(--mv-status-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 16px;
  background: var(--mv-panel);
  border-top: 1px solid var(--mv-line);
  color: var(--mv-muted);
  font-size: 11.5px;
  letter-spacing: .1px;
  z-index: 20;
}

.statusbar kbd {
  font-family: inherit;
  font-size: 11px;
  background: var(--mv-panel-2);
  border: 1px solid var(--mv-line-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 5px;
  color: var(--mv-ink);
}

/* ---------- 轻提示 ---------- */
#toast-root {
  position: fixed;
  right: 18px;
  bottom: calc(var(--mv-status-h) + 16px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  z-index: 90;
  pointer-events: none;
}

#status-hint { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status-meta { flex-shrink: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--mv-accent); outline-offset: 3px; }

.mv-toast {
  background: rgba(27, 35, 51, .94);
  color: #f8fafc;
  font-size: 12.5px;
  line-height: 1.5;
  padding: 9px 14px;
  border-radius: 9px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, .22);
  max-width: 380px;
  animation: mv-toast-in .18s ease;
}

.mv-toast.is-out { opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }

@keyframes mv-toast-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- 弹窗 ---------- */
.mv-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(18, 26, 43, .34);
  backdrop-filter: blur(2px);
  display: grid;
  place-items: center;
  padding: 24px;
  z-index: 100;
  animation: mv-fade .16s ease;
}

@keyframes mv-fade { from { opacity: 0; } to { opacity: 1; } }

.mv-modal {
  width: min(760px, 100%);
  max-height: min(84vh, 900px);
  background: var(--mv-panel);
  border-radius: 16px;
  box-shadow: 0 24px 80px rgba(15, 23, 42, .28);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: mv-modal-in .2s cubic-bezier(.2, .8, .2, 1);
}

@keyframes mv-modal-in {
  from { opacity: 0; transform: translateY(10px) scale(.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.mv-modal-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--mv-line);
}

.mv-modal-head h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: .2px;
}

.mv-modal-head p {
  margin: 5px 0 0;
  color: var(--mv-muted);
  font-size: 12.5px;
  line-height: 1.55;
}

.mv-modal-close {
  margin-left: auto;
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--mv-line);
  background: var(--mv-panel);
  width: 30px;
  height: 30px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--mv-muted);
  display: grid;
  place-items: center;
}

.mv-modal-close:hover { color: var(--mv-ink); background: var(--mv-panel-2); }
.mv-modal-close svg { width: 15px; height: 15px; }

.mv-modal-body {
  padding: 18px 22px 24px;
  overflow: auto;
  font-size: 13px;
  line-height: 1.7;
}

.mv-modal-body h3 {
  margin: 20px 0 8px;
  font-size: 13.5px;
  font-weight: 650;
  color: var(--mv-ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

.mv-modal-body h3:first-child { margin-top: 0; }

.mv-modal-body h3::before {
  content: "";
  width: 3px;
  height: 13px;
  border-radius: 2px;
  background: var(--mv-accent);
}

.mv-modal-body p { margin: 6px 0; color: #3d475c; }
.mv-modal-body ul { margin: 6px 0; padding-left: 20px; color: #3d475c; }
.mv-modal-body li { margin: 4px 0; }
.mv-modal-body code {
  font-family: var(--mv-font-math);
  background: var(--mv-panel-2);
  border: 1px solid var(--mv-line);
  padding: 1px 5px;
  border-radius: 5px;
  font-size: 12.5px;
}
.mv-modal-body kbd {
  font-family: inherit;
  font-size: 11px;
  background: var(--mv-panel-2);
  border: 1px solid var(--mv-line-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 5px;
}

.mv-callout {
  margin: 10px 0;
  padding: 11px 14px;
  border-radius: 10px;
  background: var(--mv-accent-soft);
  border: 1px solid #d5e2ff;
  color: #25438f;
  font-size: 12.5px;
  line-height: 1.65;
}

.mv-table {
  width: 100%;
  border-collapse: collapse;
  margin: 8px 0 4px;
  font-size: 12.5px;
}

.mv-table th, .mv-table td {
  text-align: left;
  padding: 7px 9px;
  border-bottom: 1px solid var(--mv-line);
  vertical-align: top;
}

.mv-table th {
  color: var(--mv-muted);
  font-weight: 550;
  font-size: 11.5px;
  letter-spacing: .3px;
  background: var(--mv-panel-2);
}

.mv-table td:first-child { font-weight: 550; white-space: nowrap; }
.mv-table .mv-keep { color: #0f766e; font-weight: 600; }
.mv-table .mv-cut { color: #b45309; }

.mv-tag {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .2px;
}

.mv-tag.keep { background: #e3f6f0; color: #0f766e; }
.mv-tag.cut { background: #fdf0dc; color: #b45309; }

.mv-help-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 8px 0 2px;
}

.mv-help-card {
  border: 1px solid var(--mv-line);
  border-radius: 10px;
  padding: 11px 13px;
  background: var(--mv-panel-2);
}

.mv-help-card b { display: block; font-size: 12.5px; margin-bottom: 4px; }
.mv-help-card span { color: var(--mv-muted); font-size: 12px; line-height: 1.6; }

/* ---------- 课堂模式 ---------- */
body.classroom .topbar { gap: 12px; }
body.classroom .brand-text small { display: none; }
body.classroom .statusbar { font-size: 12px; }
body.classroom #btn-fullscreen { display: none; }

/* ---------- 窄屏 ---------- */
@media (max-width: 1080px) {
  .brand { min-width: 0; }
  .brand-text small { display: none; }
  .topbar { gap: 12px; padding: 0 12px; }
  .tab { padding: 7px 12px; }
  .tb-btn span { display: none; }
}

@media (max-width: 760px) {
  .brand-text { display: none; }
  .brand { min-width: 0; }
  .topbar { gap: 8px; }
  .tabs { margin: 0 auto; }
  .tab { padding: 7px 10px; font-size: 12.5px; }
  .statusbar #status-meta { display: none; }
  .mv-help-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

@media (max-width: 500px) {
  .topbar { flex: 0 0 auto; flex-wrap: wrap; padding: 8px 12px; gap: 6px; }
  .tabs { order: 3; width: 100%; }
  .tab { flex: 1; justify-content: center; }
  .top-actions { gap: 4px; }
  .mv-modal-backdrop { padding: 12px; }
  .mv-modal { max-height: 90dvh; }
  .mv-toast { max-width: calc(100vw - 36px); }
}

/* Primary canvas and scene navigation; secondary editing panels; quiet status.
   Existing tokens only; 44px touch targets, 8/12/16 spacing, 12px corners. */
.lesson-bar {display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--mv-panel);border-bottom:1px solid var(--mv-line);flex:0 0 auto;min-width:0;}
.lesson-bar button,.lesson-editor button,.math-keyboard button,.g2-teaching button,.s3-edge-ratio button {min-height:44px;min-width:44px;border:1px solid var(--mv-line-strong);border-radius:8px;padding:8px 12px;background:var(--mv-panel);cursor:pointer;font-size:13px;}
.lesson-bar button:hover,.lesson-editor button:hover,.math-keyboard button:hover,.g2-teaching button:hover {background:var(--mv-accent-soft);}
.lesson-bar button:disabled,.lesson-editor button:disabled,.g2-teaching button:disabled {opacity:.45;cursor:default;}
.lesson-bar .lesson-current {max-width:360px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-weight:650;color:var(--mv-accent);background:var(--mv-accent-soft);}
.lesson-bar [data-save-status],#offline-status {font-size:12px;color:var(--mv-muted);}
#offline-status {margin-left:auto;}
.lesson-editor {display:grid;gap:16px;}
.lesson-editor label {display:grid;gap:6px;font-size:13px;font-weight:600;}
.lesson-editor input:not([type=file]),.lesson-editor textarea,.teach-grid input,.teach-grid select {border:1px solid var(--mv-line-strong);border-radius:8px;padding:10px;min-height:44px;font:inherit;max-width:100%;min-width:0;background:var(--mv-panel);color:var(--mv-ink);}
.lesson-actions {display:flex;gap:8px;flex-wrap:wrap;}
.lesson-list {margin:0;padding:0;list-style:none;display:grid;gap:8px;max-height:260px;overflow:auto;}
.lesson-list li {display:flex;gap:4px;}
.lesson-list [data-jump] {flex:1;min-width:0;text-align:left;overflow-wrap:anywhere;}
.lesson-list .is-current {border-color:var(--mv-accent);background:var(--mv-accent-soft);color:var(--mv-accent);font-weight:600;}
.lesson-note,.g2-teaching p,.math-keyboard p {font-size:12px;color:var(--mv-muted);line-height:1.6;margin:8px 0;}
.g2-teaching details {margin-top:12px;border-top:1px solid var(--mv-line);padding-top:8px;}
.g2-teaching summary,.g2-analysis summary {min-height:44px;padding:12px 0;cursor:pointer;font-weight:600;}
.teach-grid {display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;}
.teach-grid label {display:grid;gap:4px;color:var(--mv-muted);font-size:12px;min-width:0;}
.teach-steps {display:flex;gap:4px;}
.teach-steps button {padding:6px;flex:1;}
.teach-check {display:inline-flex;align-items:center;gap:6px;min-height:44px;padding-right:10px;font-size:13px;}
.teach-check input {width:20px;height:20px;accent-color:var(--mv-accent);}
[data-probe-readout] {display:block;font-size:13px;line-height:1.7;color:var(--mv-teal);overflow-wrap:anywhere;}
.math-keyboard {margin-top:8px;}
.keyboard-toggle {width:100%;color:var(--mv-accent);}
[data-keyboard] {margin-top:8px;padding:8px;background:var(--mv-panel-2);border-radius:12px;}
.keyboard-top {display:flex;align-items:center;gap:4px;justify-content:space-between;margin-bottom:8px;font-size:12px;}
.keyboard-top button {padding:6px;}
.keyboard-keys {display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;}
.keyboard-keys button {padding:0;min-width:0;font-size:15px;touch-action:manipulation;}
.s3-edge-ratio {display:flex;align-items:center;gap:6px;padding:4px 0 12px;}
.s3-edge-ratio label {flex:1;min-width:0;font-size:12px;}
.s3-edge-ratio input[type=range] {width:100%;height:36px;accent-color:var(--mv-teal);}
.s3-edge-ratio input[type=number] {width:66px;min-height:44px;border:1px solid var(--mv-line-strong);border-radius:8px;padding:4px;}
.s3-label.s3-label-control {color:#0f766e;font-weight:700;background:#fff;border:1px solid #0f766e;border-radius:6px;padding:2px 5px;}
.g2-module .g2-toolbar,.s3-toolbar {overflow-x:auto;flex-shrink:0;}
.g2-module .g2-tool {flex-shrink:0;}
.g2-module .g2-side-toggle {display:inline-flex;}
.g2-module .g2-side-head .g2-drawer-close {display:inline-flex;}
.g2-module.g2-side-hidden:not(.g2-narrow) .g2-sidebar {display:none;}
.g2-module .g2-canvas {touch-action:none;}
@media (pointer:coarse) {
  .g2-module button,.s3-root button,.topbar button {min-height:44px;min-width:44px;}
  .g2-module .g2-fn-input,.g2-module .g2-param-value,.s3-root input[type=number],.s3-root select {min-height:44px;font-size:16px;}
  .g2-module .g2-option,.s3-root .s3-row {min-height:44px;}
  .g2-module .g2-param-slider,.s3-root .s3-range {min-height:40px;}
  .g2-module .g2-toolbar {height:56px;}
  .g2-module .g2-param-range {min-height:44px;display:flex;align-items:center;}
  .g2-module .g2-fn-dot {background:transparent;border:0;box-shadow:none;position:relative;border-radius:8px;}
  .g2-module .g2-fn-dot::after {content:'';position:absolute;width:12px;height:12px;left:16px;top:16px;border-radius:50%;background:currentColor;border:2px solid #fff;box-shadow:0 0 0 1.4px currentColor;}
  .g2-module .g2-fn-row {display:grid;grid-template-columns:44px 1fr 44px 44px;grid-template-rows:44px 44px;height:auto;gap:0 4px;}
  .g2-module .g2-fn-dot {grid-column:1;grid-row:1;}
  .g2-module .g2-fn-label {grid-column:2;grid-row:1;}
  .g2-module .g2-fn-row [data-fn-eye] {grid-column:3;grid-row:1;}
  .g2-module .g2-fn-row [data-fn-del] {grid-column:4;grid-row:1;}
  .g2-module .g2-fn-input {grid-column:1/-1;grid-row:2;width:100%;padding:0 8px;background:var(--mv-panel);border-radius:6px;}
}
@media(max-width:1000px) { .lesson-bar [data-save-status] {display:none;} .lesson-bar {gap:4px;padding:6px 8px;} .lesson-bar button {padding:6px 8px;} }
@media(max-width:600px) { .lesson-bar #offline-status {display:none;} .lesson-bar [data-lesson-reset] {font-size:12px;} .lesson-bar .lesson-current {font-size:12px;} .lesson-list li {flex-wrap:wrap;} .lesson-list [data-jump] {flex-basis:100%;} }
.lesson-bar.save-failed {flex-wrap:wrap;}
.lesson-bar.save-failed [data-save-status] {display:block;color:var(--mv-danger);font-weight:600;}

/* Undo stays adjacent to the step navigator. Preparing and presenting have
   distinct labels; accent belongs to advancing / recording the next step. */
.replay-bar {display:flex;align-items:center;gap:8px;flex:0 0 auto;min-width:0;padding:6px 12px;background:var(--mv-panel-2);border-bottom:1px solid var(--mv-line);}
.replay-bar button {min-width:44px;min-height:44px;border:1px solid var(--mv-line-strong);border-radius:8px;background:var(--mv-panel);padding:8px 12px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;}
.replay-bar button:hover {background:var(--mv-accent-soft);}
.history-actions {display:flex;gap:4px;flex:0 0 auto;}
.replay-bar button:disabled,.lesson-editor button:disabled {opacity:.45;cursor:default;}
.replay-bar .step-status {max-width:360px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left;font-weight:600;}
.replay-bar .step-primary,.lesson-editor .step-primary {background:var(--mv-accent);border-color:var(--mv-accent);color:#fff;}
.replay-bar .step-primary:hover,.lesson-editor .step-primary:hover {background:#1d4ed8;}
.step-note {min-width:0;flex:1;font-size:12px;color:var(--mv-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.step-list {display:grid;gap:16px;max-height:48dvh;overflow:auto;overscroll-behavior:contain;padding:2px;}
.step-card {display:grid;gap:12px;padding:16px;border:1px solid var(--mv-line);border-radius:var(--mv-radius);background:var(--mv-panel-2);}
.step-card .lesson-actions button {padding:8px;}
.trash-row {display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--mv-line);}
.trash-row span {flex:1;overflow-wrap:anywhere;}
@media(max-width:1100px){.step-note{display:none;}.replay-bar{gap:4px;padding:6px 8px;}.replay-bar button{padding:8px;}}
@media(max-width:600px){
  .replay-bar{flex-wrap:wrap;}
  .history-actions span{display:none;}
  .replay-bar .step-status{max-width:none;flex-basis:calc(100% - 104px);}
  .replay-bar [data-step-start]{margin-left:auto;}

.g2-module {
  --g2-sidebar-w: 336px;
  position: absolute;
  inset: 0;
  display: flex;
  background: var(--mv-bg);
  color: var(--mv-ink);
  font-family: var(--mv-font);
  font-size: 13px;
  line-height: 1.5;
  text-align: left;
  min-width: 0;
  min-height: 0;
}
.g2-module *, .g2-module *::before, .g2-module *::after { box-sizing: border-box; }
.g2-module button, .g2-module input { font-family: inherit; }
.g2-module .g2-drawer-close { display: none; }

/* ---------------- \u4FA7\u680F ---------------- */
.g2-sidebar {
  position: relative;
  flex: 0 0 var(--g2-sidebar-w);
  width: var(--g2-sidebar-w);
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--mv-panel);
  border-right: 1px solid var(--mv-line);
  z-index: 20;
}
.g2-side-head {
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--mv-line);
}
.g2-side-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 650;
  letter-spacing: .2px;
  white-space: nowrap;
}
.g2-side-title svg { width: 16px; height: 16px; color: var(--mv-accent); flex: 0 0 auto; }
.g2-side-sub { margin-left: auto; font-size: 11px; color: var(--mv-muted); white-space: nowrap; }
.g2-side-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  padding-bottom: 10px;
}
.g2-side-scroll::-webkit-scrollbar { width: 9px; }
.g2-side-scroll::-webkit-scrollbar-thumb {
  background: #d7deea; border-radius: 99px; border: 2px solid var(--mv-panel);
}
.g2-side-scroll::-webkit-scrollbar-thumb:hover { background: #c3ccdd; }

/* ---------------- \u533A\u5757 ---------------- */
.g2-card { border-bottom: 1px solid var(--mv-line); }
.g2-card-head {
  height: 38px;
  padding: 0 10px 0 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.g2-card-toggle {
  appearance: none;
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  border: 0;
  background: transparent;
  color: var(--mv-ink);
  cursor: pointer;
  text-align: left;
}
.g2-card-toggle:hover { background: transparent; }
.g2-card-head:hover { background: var(--mv-panel-2); }
.g2-card-title { font-size: 12.5px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
.g2-card-meta { margin-left: auto; font-size: 11px; color: var(--mv-muted); white-space: nowrap; }
.g2-card-chevron {
  width: 14px; height: 14px; flex: 0 0 auto; color: var(--mv-muted);
  transition: transform .16s ease;
}
.g2-card.is-collapsed .g2-card-chevron { transform: rotate(-90deg); }
.g2-card.is-collapsed .g2-card-head:hover { background: var(--mv-panel-2); }
.g2-card-body { padding: 2px 14px 14px; }
.g2-card.is-collapsed .g2-card-body { display: none; }
.g2-card-head-actions { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; }

/* ---------------- \u51FD\u6570\u5217\u8868 ---------------- */
.g2-fn-list { display: flex; flex-direction: column; gap: 7px; }
.g2-fn-item { display: flex; flex-direction: column; gap: 2px; }
.g2-fn-row {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 34px;
  padding: 0 3px 0 7px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: var(--mv-panel-2);
  transition: background .15s ease, border-color .15s ease;
}
.g2-fn-row:hover { background: #f1f5fb; }
.g2-fn-row.is-selected {
  background: #f2f7ff;
  border-color: #d3e1ff;
}
.g2-fn-row.is-hidden { opacity: .55; }
.g2-fn-row.is-invalid .g2-fn-input { color: var(--mv-danger); }
.g2-fn-row.is-invalid .g2-fn-dot { opacity: .55; }
.g2-fn-dot {
  appearance: none;
  width: 12px;
  height: 12px;
  flex: 0 0 auto;
  padding: 0;
  border-radius: 50%;
  border: 2px solid #fff;
  background: currentColor;
  box-shadow: 0 0 0 1.4px currentColor;
  cursor: pointer;
}
.g2-fn-dot:focus-visible, .g2-icon-btn:focus-visible, .g2-btn:focus-visible,
.g2-tool:focus-visible, .g2-lib-btn:focus-visible, .g2-card-toggle:focus-visible {
  outline: 2px solid var(--mv-accent);

.s3-root {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--mv-bg, #f3f5f9);
  color: var(--mv-ink, #1b2333);
  font-family: var(--mv-font, "Segoe UI", "Microsoft YaHei", sans-serif);
  font-size: 13px;
  line-height: 1.45;
  overflow: hidden;
}
.s3-root *, .s3-root *::before, .s3-root *::after { box-sizing: border-box; }
.s3-root button { font-family: inherit; color: inherit; }
.s3-root svg { display: block; }

.s3-app { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ---------- \u9876\u90E8\u5DE5\u5177\u6761 ---------- */
.s3-toolbar {
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: var(--mv-panel, #fff);
  border-bottom: 1px solid var(--mv-line, #e3e8f0);
  position: relative;
  z-index: 40;
}
.s3-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.s3-brand-mark {
  width: 28px; height: 28px; flex: 0 0 auto;
  border-radius: 8px;
  display: grid; place-items: center;
  background: var(--mv-accent-soft, #e9efff);
  color: var(--mv-accent, #2563eb);
}
.s3-brand-mark svg { width: 18px; height: 18px; }
.s3-brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.s3-brand-text b { font-size: 13.5px; font-weight: 650; letter-spacing: .2px; }
.s3-brand-text small { color: var(--mv-muted, #687186); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s3-toolbar-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.s3-tbtn {
  appearance: none; border: 1px solid transparent; background: transparent;
  color: var(--mv-muted, #687186); font-size: 12px;
  height: 30px; padding: 0 9px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.s3-tbtn svg { width: 15px; height: 15px; }
.s3-tbtn:hover { background: var(--mv-panel-2, #f8fafc); color: var(--mv-ink, #1b2333); border-color: var(--mv-line, #e3e8f0); }
.s3-tbtn.is-on { color: var(--mv-accent, #2563eb); background: var(--mv-accent-soft, #e9efff); border-color: #c9d9ff; }
.s3-tbtn:focus-visible, .s3-solid-btn:focus-visible, .s3-viewbtn:focus-visible,
.s3-tab:focus-visible, .s3-sec-head:focus-visible { outline: 2px solid var(--mv-accent, #2563eb); outline-offset: 1px; }

/* ---------- \u4E3B\u4F53 ---------- */
.s3-main { position: relative; flex: 1 1 auto; display: flex; min-width: 0; min-height: 0; }

/* ---------- \u4FA7\u680F ---------- */
.s3-side {
  flex: 0 0 342px;
  width: 342px;
  background: var(--mv-panel, #fff);
  border-right: 1px solid var(--mv-line, #e3e8f0);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 12px 26px;
  min-height: 0;
  z-index: 30;
  scrollbar-width: thin;
}
.s3-side::-webkit-scrollbar { width: 8px; }
.s3-side::-webkit-scrollbar-thumb { background: #dbe2ee; border-radius: 4px; }
.s3-side::-webkit-scrollbar-track { background: transparent; }
.s3-side-head { display: none; align-items: center; gap: 8px; padding: 2px 2px 8px; }
.s3-side-head b { font-size: 12.5px; }
.s3-side-head button {
  margin-left: auto; appearance: none; border: 1px solid var(--mv-line, #e3e8f0);
  background: var(--mv-panel, #fff); width: 28px; height: 28px; border-radius: 7px;
  display: grid; place-items: center; cursor: pointer; color: var(--mv-muted, #687186);
}
.s3-side-head svg { width: 14px; height: 14px; }
.s3-side-hidden .s3-side { display: none; }

/* \u7A84\u5C4F\u62BD\u5C49 */
.s3-narrow .s3-side {
  position: absolute; top: 0; left: 0; bottom: 0;
  width: min(330px, 88%);
  transform: translateX(-104%);
  transition: transform .2s ease;
  box-shadow: 0 16px 48px rgba(15, 23, 42, .2);
  display: flex; flex-direction: column;
}
.s3-narrow.s3-drawer-open .s3-side { transform: translateX(0); }
.s3-narrow .s3-side-head { display: flex; }
.s3-narrow .s3-side-head, .s3-narrow .s3-sec { flex-shrink: 0; }

/* ---------- \u5206\u533A\u5361\u7247 ---------- */
.s3-sec {
  border: 1px solid var(--mv-line, #e3e8f0);
  border-radius: var(--mv-radius, 12px);
  background: var(--mv-panel, #fff);
  margin-bottom: 9px;
  overflow: hidden;
}
.s3-sec-head {
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 11px;
  cursor: pointer; user-select: none;
}
.s3-sec-head:hover { background: var(--mv-panel-2, #f8fafc); }
.s3-sec-ico {
  width: 20px; height: 20px; flex: 0 0 auto;
  border-radius: 6px; display: grid; place-items: center;
  background: var(--mv-accent-soft, #e9efff); color: var(--mv-accent, #2563eb);
}
.s3-sec-ico svg { width: 13px; height: 13px; }
.s3-sec-head h3 { margin: 0; font-size: 12.5px; font-weight: 650; letter-spacing: .2px; }
.s3-caret { margin-left: auto; color: var(--mv-muted, #687186); width: 14px; height: 14px; transition: transform .16s ease; }
.s3-caret svg { width: 14px; height: 14px; }
.s3-sec.is-collapsed .s3-caret { transform: rotate(-90deg); }
.s3-sec.is-collapsed .s3-sec-body { display: none; }
.s3-sec-body { padding: 2px 11px 11px; border-top: 1px solid var(--mv-line, #e3e8f0); }

/* ---------- \u51E0\u4F55\u4F53\u9009\u62E9 ---------- */
.s3-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding-top: 9px; }
.s3-solid-btn {
  appearance: none; display: flex; align-items: center; gap: 7px;
  min-height: 36px; padding: 4px 8px; text-align: left;
  border: 1px solid var(--mv-line, #e3e8f0); border-radius: 9px;
  background: var(--mv-panel, #fff); color: var(--mv-ink, #1b2333);
  font-size: 11.5px; cursor: pointer; transition: border-color .14s, background .14s, color .14s;
}
.s3-solid-btn svg { width: 18px; height: 18px; flex: 0 0 auto; color: var(--mv-teal, #0d9488); }
.s3-solid-btn span { line-height: 1.2; }
.s3-solid-btn:hover { border-color: var(--mv-line-strong, #cfd6e4); background: var(--mv-panel-2, #f8fafc); }
.s3-solid-btn.is-active {
  border-color: #b9ccff; background: var(--mv-accent-soft, #e9efff); color: var(--mv-accent, #2563eb);
  box-shadow: inset 0 0 0 1px #d5e2ff;
}
.s3-solid-btn.is-active svg { color: var(--mv-accent, #2563eb); }

/* ---------- \u53C2\u6570 ---------- */
.s3-params { padding-top: 4px; }
.s3-param { margin-top: 10px; }
.s3-param:first-child { margin-top: 4px; }
.s3-param-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.s3-param-label span { color: var(--mv-muted, #687186); font-size: 12px; }
.s3-param-label b { font-family: var(--mv-font-math, serif); font-size: 12.5px; font-weight: 650; color: var(--mv-ink, #1b2333); }
.s3-param-row { display: flex; align-items: center; gap: 9px; }
.s3-range { flex: 1 1 auto; min-width: 0; height: 18px; accent-color: var(--mv-accent, #2563eb); cursor: pointer; }
.s3-num {
  flex: 0 0 62px; width: 62px; height: 28px; padding: 0 6px;
  border: 1px solid var(--mv-line, #e3e8f0); border-radius: 7px;
  background: var(--mv-panel-2, #f8fafc); color: var(--mv-ink, #1b2333);
  font-family: var(--mv-font-math, serif); font-size: 12px;
}
.s3-num:focus { outline: none; border-color: var(--mv-accent, #2563eb); background: #fff; }
.s3-param-extra { margin-top: 10px; }

/* ---------- \u5F00\u5173 / \u884C ---------- */
.s3-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 33px; padding: 5px 0; border-bottom: 1px dashed var(--mv-line, #e3e8f0);
  font-size: 12.5px;
}
